[package]
name = "karlsen-desktop"
version = "3.1.0"
description = "Karlsen Desktop - full node launcher, dashboard, wallet and KarlsenMiner"
authors = ["Karlsen Network"]
license = "ISC"
repository = "https://github.com/karlsencoin/karlsen-desktop"
edition = "2021"
rust-version = "1.80"

[lib]
name = "karlsen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
anyhow = "1"
log = "0.4"
shared_child = "1.1"
# KarlsenMiner download + verification (miner_install.rs)
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "proxy-from-env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
