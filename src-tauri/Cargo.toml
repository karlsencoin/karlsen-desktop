[package]
name = "karlsen-desktop"
version = "3.0.0"
description = "Karlsen Desktop - full node launcher, dashboard and wallet"
authors = ["Karlsen Network"]
license = "ISC"
repository = "https://github.com/karlsencoin/karlsen-desktop"
edition = "2021"
rust-version = "1.80"

[lib]
name = "karlsen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
anyhow = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
